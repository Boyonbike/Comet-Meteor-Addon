[versions]
mod-version = "0.26.27"

# Fabric (https://fabricmc.net/develop)
jdk = "21"
minecraft = "1.21.11"
fabric-loader = "0.19.3"

# Loom (https://github.com/FabricMC/fabric-loom)
loom = "1.17.21"

# Meteor (https://github.com/MeteorDevelopment/meteor-client/)
# Pinned to build 82 in vendor/maven because upstream pruned this snapshot.
# See vendor/README.md for the artifact source, checksum and upstream commit.
meteor = "1.21.11-82"

# Mods
# Xaero's Minimap, compile-only (players install it themselves). Versions: https://modrinth.com/mod/xaeros-minimap/versions
xaero-minimap = "fabric-1.21.11-26.6.0"
# Baritone, compile-only (Meteor's build, which players install themselves). Same jar as baritone-meteor-1.21.11.jar; newest <value> at
# https://maven.meteordev.org/snapshots/meteordevelopment/baritone/1.21.11-SNAPSHOT/maven-metadata.xml
baritone = "1.21.11-20260103.131549-1"

[libraries]
# Fabric base
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }

# Meteor client
meteor-client = { module = "meteordevelopment:meteor-client", version.ref = "meteor" }

# Mods
xaero-minimap = { module = "maven.modrinth:xaeros-minimap", version.ref = "xaero-minimap" }
baritone = { module = "meteordevelopment:baritone", version.ref = "baritone" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom-remap", version.ref = "loom" }
