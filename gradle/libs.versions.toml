[versions]
mod-version = "0.27.0"

# Fabric (https://fabricmc.net/develop)
jdk = "25"
minecraft = "26.2"
fabric-loader = "0.19.3"

# Loom (https://github.com/FabricMC/fabric-loom)
loom = "1.17.21"

# Meteor (https://github.com/MeteorDevelopment/meteor-client/)
# Pinned to snapshot build 35; to update, take the newest <value> from
# https://maven.meteordev.org/snapshots/meteordevelopment/meteor-client/26.2-SNAPSHOT/maven-metadata.xml
meteor = "26.2-20261009.074120-35"

# Test-only Fabric API client game-test module. This is the module version bundled by
# Fabric API 0.161.0+26.2; it is not part of the shipped mod.
fabric-client-gametest = "6.0.2+0f4f1dca9e"

# Mods
# Xaero's Minimap, compile-only (players install it themselves). Versions: https://modrinth.com/mod/xaeros-minimap/versions
xaero-minimap = "fabric-26.2-26.6.1"
# Baritone, compile-only (Meteor's build, which players install themselves). Same jar as baritone-meteor-26.2.jar; newest <value> at
# https://maven.meteordev.org/snapshots/meteordevelopment/baritone/26.2-SNAPSHOT/maven-metadata.xml
baritone = "26.2-20260813.152229-1"

[libraries]
# Fabric base
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }

# Meteor client
meteor-client = { module = "meteordevelopment:meteor-client", version.ref = "meteor" }

# Test-only client game-test API
fabric-client-gametest = { module = "net.fabricmc.fabric-api:fabric-client-gametest-api-v1", version.ref = "fabric-client-gametest" }

# Mods
xaero-minimap = { module = "maven.modrinth:xaeros-minimap", version.ref = "xaero-minimap" }
baritone = { module = "meteordevelopment:baritone", version.ref = "baritone" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
